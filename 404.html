<style>
:root{--ink:#191F28;--sub:#4E5968;--muted:#8B95A1;--line:#E5E8EB;--bg:#FFFFFF;--bg2:#F8F9FA;
--navy:#1D2032;--mint:#00C88C;--mintbg:#EAFBF4;--red:#EB5757;--redbg:#FDEEEE;--amber:#F2994A;--amberbg:#FEF3E8;}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);
font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1080px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:24px}
.nav .brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.nav .brand .dot{width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.nav .menu{display:flex;gap:18px;font-size:14px;font-weight:600;color:var(--sub)}
.nav .menu a:hover{color:var(--ink)}
.nav .sp{flex:1}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.hero{background:var(--navy);color:#fff;padding:56px 0 64px}
.hero h1{font-size:34px;font-weight:800;line-height:1.3;letter-spacing:-.5px}
.hero p{margin-top:12px;color:#B6BAC7;font-size:16px}
.hero .search{margin-top:28px;max-width:560px;position:relative}
.hero .search input{width:100%;height:56px;border-radius:14px;border:none;padding:0 20px 0 48px;font-size:16px;font-family:inherit;outline:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hero .search .ic{position:absolute;left:18px;top:17px;color:#8B95A1}
.chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:7px 14px;border-radius:20px;background:rgba(255,255,255,.12);color:#DDE0E7;cursor:pointer;border:none;font-family:inherit}
.chip.on,.chip:hover{background:var(--mint);color:#00382a}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-30px;position:relative;z-index:2}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 2px 8px rgba(25,31,40,.04)}

.sec{margin-top:52px}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

.rowbar .tr{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.rowbar .fl{height:100%;border-radius:4px;background:var(--mint)}
.rowbar .fl.down{background:var(--red)} .rowbar .fl.warn{background:var(--amber)} .rowbar .fl.navy{background:var(--navy)}
.rowbar .vl{flex:0 0 auto;font-weight:700;font-size:13px;color:var(--sub);white-space:nowrap}
.rowbar:hover .lb{color:var(--mint)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px;margin-right:5px;background:var(--bg2);color:var(--sub)}
.tag.up{background:var(--mintbg);color:#00996B} .tag.down{background:var(--redbg);color:var(--red)} .tag.warn{background:var(--amberbg);color:#D97F1D}

.ccard .nm{font-size:16px;font-weight:800;letter-spacing:-.2px}
.ccard .rk{font-size:12px;color:var(--muted);font-weight:600}
.mrow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-top:1px solid var(--bg2)}
.mrow .k{color:var(--muted)} .mrow .v{font-weight:700}
.mrow .v.up{color:#00996B} .mrow .v.down{color:var(--red)}
.foot{margin-top:72px;background:var(--bg2);border-top:1px solid var(--line);padding:32px 0 48px;font-size:12.5px;color:var(--muted);line-height:1.8}
.crumb{font-size:13px;color:var(--muted);margin:24px 0 12px}
.crumb a{color:var(--muted)} .crumb a:hover{color:var(--ink)}
.chead{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.chead .avatar{width:64px;height:64px;border-radius:18px;font-size:24px}
.chead h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
.score-badge{margin-left:auto;text-align:center;background:var(--navy);color:#fff;border-radius:16px;padding:12px 22px}
.score-badge .s{font-size:26px;font-weight:800;line-height:1.1}
.score-badge .t{font-size:12px;color:#B6BAC7}
.stitle{font-size:17px;font-weight:800;margin-bottom:14px;letter-spacing:-.2px}
.cklist{list-style:none}
.cklist li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg2);font-size:14px;color:var(--sub)}
.cklist li:last-child{border-bottom:none}
.ck{flex:0 0 8px;height:8px;border-radius:50%;margin-top:7px;background:var(--line)}
.ck.up{background:var(--mint)} .ck.down{background:var(--red)} .ck.warn{background:var(--amber)}
.simrow{display:flex;gap:10px;flex-wrap:wrap}
.sim{border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
.sim:hover{border-color:var(--mint);color:#00996B}
.sim small{color:var(--muted);font-weight:600}
.src{font-size:12.5px;color:var(--muted);margin-top:12px}
.axes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.axis{text-align:center;background:var(--bg2);border-radius:12px;padding:14px 8px}
.axis .n{font-size:22px;font-weight:800}
.axis .l{font-size:12.5px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--bg2);font-weight:600}
@media(max-width:860px){.grid3,.grid4,.statrow,.axes{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}
.hero h1{font-size:26px}.rowbar .lb{flex-basis:110px;font-size:13px}}
@media(max-width:520px){.grid3,.grid4{grid-template-columns:1fr}.statrow{grid-template-columns:repeat(2,1fr)}}
